name: Bootstrap My Life Room V13

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v13.yml'

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact V13 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v13.part.00 .bootstrap/v13.part.01 .bootstrap/v13.part.02 .bootstrap/v13.part.03 .bootstrap/v13.part.04 | base64 -d > /tmp/v13.zip
          echo '32c21b6edfa9944d19c667de9cb0dd8f958d1a3f50cd8af64ce2e7c1badc255c  /tmp/v13.zip' | sha256sum -c -
          unzip -t /tmp/v13.zip

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v13
          mkdir -p /tmp/v13
          unzip -q /tmp/v13.zip -d /tmp/v13
          test -d /tmp/v13/github_repo
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/v13/github_repo/. ./

      - name: Install and run V13 preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node preflight.mjs

      - name: Commit restored V13 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Restore verified My Life Room V13 source'
            git push
          fi
