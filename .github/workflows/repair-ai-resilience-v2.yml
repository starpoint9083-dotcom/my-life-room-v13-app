name: One Shot AI Resilience Repair V2

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/repair-ai-resilience.mjs'
      - '.github/workflows/repair-ai-resilience-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic repair
        run: node scripts/repair-ai-resilience.mjs

      - name: Validate repaired family
        run: |
          set -euo pipefail
          node --check scripts/repair-ai-resilience.mjs
          node --check src/visual-engine.js
          node --check public/avatar-runtime-v15.js
          node --check public/visual-runtime-v17.js
          node --check scripts/verify-deployment.mjs
          node --check preflight.mjs
          npm audit --omit=dev --audit-level=high
          for i in $(seq 1 10); do
            echo "=== resilience validation $i/10 ==="
            npm run check
            rm -rf .wrangler-resilience-dry-run
            npx wrangler deploy --dry-run --outdir .wrangler-resilience-dry-run
          done

      - name: Commit repaired source
        run: |
          set -euo pipefail
          if git diff --quiet -- src/visual-engine.js public/avatar-runtime-v15.js public/visual-runtime-v17.js scripts/verify-deployment.mjs preflight.mjs; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/visual-engine.js public/avatar-runtime-v15.js public/visual-runtime-v17.js scripts/verify-deployment.mjs preflight.mjs
          git commit -m 'Harden Workers AI timeout and retry handling'
          git push origin HEAD:main
