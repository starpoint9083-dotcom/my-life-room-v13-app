name: Align deployment verifier with V20

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-verify-v20.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Align verifier with V20 pose engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-deployment.mjs')
          s = p.read_text()
          replacements = [
            ('b.includes("/room-runtime-v19.js")],', 'b.includes("/room-runtime-v19.js")&&b.includes("/pose-runtime-v20.js")],'),
            ('d?.roomEngine==="v19"],', 'd?.roomEngine==="v19"&&d?.poseEngine==="v20"],'),
            (' ["manifest","/manifest.webmanifest"', ' ["pose-runtime","/pose-runtime-v20.js",(r,d,b)=>b.includes("POSES")&&b.includes("ensurePose")&&b.includes("/api/avatar/pose")&&b.includes("poseV20")],\n ["manifest","/manifest.webmanifest"'),
            ('b.includes("my-life-room-v19-shell")&&b.includes("/visual-runtime-v17.js")&&b.includes("/room-runtime-v19.js")', 'b.includes("my-life-room-v20-shell")&&b.includes("/visual-runtime-v17.js")&&b.includes("/room-runtime-v19.js")&&b.includes("/pose-runtime-v20.js")'),
            ('DEPLOYMENT VERIFIED FULL ROOM V19', 'DEPLOYMENT VERIFIED FULL ROOM V20')
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              elif new in s:
                  pass
              else:
                  raise SystemExit(f'Expected verifier pattern not found: {old}')
          if changed:
              p.write_text(s)
              print('Verifier aligned with V20.')
          else:
              print('Verifier already aligned with V20.')
          PY

      - name: Validate verifier and preflight
        run: |
          set -euo pipefail
          node --check scripts/verify-deployment.mjs
          node preflight.mjs

      - name: Commit verifier repair
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/verify-deployment.mjs; then
            echo 'No verifier change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-deployment.mjs
          git commit -m 'Align deployment verification with V20 pose engine'
          git push
