name: Deploy My Life Room V13 to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax and production dependency audit
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/life-engine.js
          node --check src/visual-engine.js
          node --check public/runtime-v14.js
          node --check public/avatar-runtime-v15.js
          node --check public/reset-runtime-v16.js
          node --check public/visual-runtime-v17.js
          node --check public/room-runtime-v19.js
          node --check public/pose-runtime-v20.js
          node --check public/core-runtime-v21.js
          node --check public/continuity-runtime-v22.js
          node --check preflight.mjs
          node --check scripts/prepare-cloudflare.mjs
          node --check scripts/verify-deployment.mjs
          node --check scripts/verify-v22-live.mjs
          node --check scripts/visual-hotfix-selfcheck.mjs
          node --check scripts/check-live.mjs
          node --check scripts/ai-autopilot.mjs
          npm audit --omit=dev --audit-level=high

      - name: Ten-pass V13 preflight and Wrangler dry-run
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "=== validation pass $i/10 ==="
            npm run check
            rm -rf .wrangler-dry-run
            npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          done

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is required for the final Cloudflare deployment."
            exit 1
          fi

      - name: Prepare Cloudflare resources, migrate D1, and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:prepare

      - name: Verify deployed V13 end to end
        run: npm run deploy:verify

      - name: Verify deployed P2 V22 runtimes
        run: node scripts/verify-v22-live.mjs
