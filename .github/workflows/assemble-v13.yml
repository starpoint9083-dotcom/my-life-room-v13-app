name: Assemble My Life Room V13

on:
  push:
    paths:
      - '.index-parts/**'
      - '.github/workflows/assemble-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all index parts exist
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06; do
            test -f ".index-parts/index.${n}.part"
          done

      - name: Assemble original V13 index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat .index-parts/index.00.part \
              .index-parts/index.01.part \
              .index-parts/index.02.part \
              .index-parts/index.03.part \
              .index-parts/index.04.part \
              .index-parts/index.05.part \
              .index-parts/index.06.part > public/index.html
          echo 'bb6fec9276b4089306a39a84b54b1efe89c2c0d3c196d246409fcfdf01316e9f  public/index.html' | sha256sum -c -

      - name: Recreate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Run V13 preflight
        run: node preflight.mjs

      - name: Commit assembled V13 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html package-lock.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Assemble verified My Life Room V13 app'
          git push origin HEAD:main
